name: Claude task (JoTube)

# A task for Claude Code, paid with the ANTHROPIC_API_KEY secret (Claude Console credits).
# Push a branch named claude-task/<name> with the instructions in .claude-task/TASK.md.
# Claude works on that branch; its changes and .claude-task/REPORT.md are committed back to it.
on:
  push:
    branches:
      - 'claude-task/**'
    paths:
      - '.claude-task/TASK.md'

concurrency:
  group: claude-task-${{ github.ref }}
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply MediaServiceCore patches (Claude sees the patched code; its edits there become a new patch)
        run: |
          cd MediaServiceCore
          for p in ../patches/MediaServiceCore/*.patch; do git apply "$p"; done
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "patched base" || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            cat .claude-task/TASK.md
            echo
            echo 'Write a short report of what you found and changed to .claude-task/REPORT.md (overwrite it).'
            echo 'Do not commit or push: the workflow commits your changes. Never touch secrets, signing keys or .github/.'
          } > /tmp/prompt.md
          # API credits are limited: every task has a hard budget (.claude-task/BUDGET_USD, default 1.00 USD),
          # and what it really cost is written to .claude-task/COST_USD (read by the media3 progress log)
          BUDGET=$(cat .claude-task/BUDGET_USD 2>/dev/null || echo 1.00)
          claude -p "$(cat /tmp/prompt.md)" \
            --model claude-sonnet-5-5 \
            --max-turns 120 \
            --max-budget-usd "$BUDGET" \
            --output-format json \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(cat:*),Bash(wc:*)" \
            > /tmp/claude-output.json 2>/tmp/claude-stderr.txt || echo "Claude Code exited with $?" >> /tmp/claude-stderr.txt
          mkdir -p .claude-task
          jq -r '.result // empty' /tmp/claude-output.json > .claude-task/OUTPUT.md 2>/dev/null || cp /tmp/claude-output.json .claude-task/OUTPUT.md
          cat /tmp/claude-stderr.txt >> .claude-task/OUTPUT.md
          jq -r '.total_cost_usd // empty' /tmp/claude-output.json > .claude-task/COST_USD 2>/dev/null || true
          echo "Budget: $BUDGET USD, cost: $(cat .claude-task/COST_USD 2>/dev/null) USD"
          tail -c 3000 .claude-task/OUTPUT.md

      - name: Commit the result
        if: always()
        run: |
          # Edits in the submodule become patches/MediaServiceCore/0100-<task>.patch; the submodule itself stays at its base
          if [ -n "$(git -C MediaServiceCore status --porcelain)" ]; then
            git -C MediaServiceCore add -A
            git -C MediaServiceCore diff --cached > "patches/MediaServiceCore/0100-${GITHUB_REF_NAME#claude-task/}.patch"
          fi
          git submodule update --force --checkout MediaServiceCore
          git config user.name "Pompadoure"
          git config user.email "Pompadoure@users.noreply.github.com"
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Claude task: ${GITHUB_REF_NAME#claude-task/}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
