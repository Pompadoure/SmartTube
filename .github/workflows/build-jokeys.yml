name: Build JoKeys (jokeys branch)

# JoKeys: remaps the YouTube / Netflix buttons of the Google TV remote to JoTube / Plex.
# Every push to jokeys builds a signed APK (JoTube's key) and publishes the pre-release "latest-jokeys".

on:
  push:
    branches: [ "jokeys" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName '1.0'/versionName '1.${{ github.run_number }}'/" app/build.gradle

      - name: Build
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/key.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.jks" --ks-pass env:KEY_STORE_PASSWORD \
            --ks-key-alias "$ALIAS" --key-pass env:KEY_PASSWORD --out out/JoKeys.apk out/aligned.apk
          rm out/aligned.apk "$RUNNER_TEMP/key.jks"
          "$BT/apksigner" verify out/JoKeys.apk

      - name: Publish pre-release "latest-jokeys"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-jokeys --cleanup-tag --yes || true
          gh release create latest-jokeys out/JoKeys.apk --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "JoKeys (latest)" --notes "YouTube button -> JoTube, Netflix button -> Plex. Build ${{ github.run_number }}."
