name: Build SmartTube J

# Personal build of SmartTube (org.smarttube.johan).
# Every push to master builds a signed APK and publishes it as the "latest-j" release:
#   https://github.com/Pompadoure/SmartTube/releases/download/latest-j/SmartTubeJ_armeabi-v7a.apk

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-johan
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Apply JoTube patches to the submodules
        run: |
          # Small fixes on top of the upstream submodules (kept as patches, the submodules stay upstream)
          for p in patches/MediaServiceCore/*.patch; do
            echo "Applying $p"
            git -C MediaServiceCore apply --verbose "../$p"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Version name
        id: version
        run: |
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-j${{ github.run_number }}\"/" smarttubetv/build.gradle
          # Always increasing, independent of the upstream base version (updates never become downgrades)
          sed -i "s/versionCode [0-9]*/versionCode $((1000000 + ${{ github.run_number }}))/" smarttubetv/build.gradle
          echo "name=$(grep -m1 'versionName' smarttubetv/build.gradle | awk -F'"' '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Signing secrets are missing (SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/key.jks"
          {
            echo "storeFile=$RUNNER_TEMP/key.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleStjohanRelease 2>&1 | tee build.log; then
            # Compiler errors as annotations (readable without the raw log)
            grep -E "error:|\.java:[0-9]+: |^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          dir=smarttubetv/build/outputs/apk/stjohan/release
          ls -l "$dir"
          cp "$dir"/*_armeabi-v7a.apk out/SmartTubeJ_armeabi-v7a.apk
          cp "$dir"/*_arm64-v8a.apk out/SmartTubeJ_arm64-v8a.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTubeJ_${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: Publish release "latest-j"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-j --cleanup-tag --yes || true
          # Give GitHub a moment to remove the old tag, otherwise the new release can end up as a draft
          sleep 10
          gh release create latest-j out/* --latest \
            --target "${{ github.sha }}" \
            --title "JoTube ${{ steps.version.outputs.name }}" \
            --notes "Personal build from ${{ github.sha }}. Install the armeabi-v7a APK on Google TV Streamer / Mi Box."
          # Make sure it's published (drafts aren't downloadable)
          gh release edit latest-j --draft=false
