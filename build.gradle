// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: gradle.ext.sharedModulesConstants

// NOT working
// Running 'gradle wrapper' will generate gradlew
wrapper {
    gradleVersion = gradleVersion
    distributionType = Wrapper.DistributionType.BIN
}

buildscript {
    apply from: gradle.ext.sharedModulesConstants

    // JoTube M3 toolchain (PLAN.md Decisions 3): Media3 1.11 needs compileSdk 36 -> AGP 8.x, Gradle 8.x, Kotlin 2.x.
    // The shared constants (submodule) stay untouched; these override them for every module (see m3Toolchain below).
    ext.m3AgpVersion = '8.13.0'
    ext.m3KotlinVersion = '2.2.0'
    ext.m3CompileSdk = 36
    // Media3 version for every module (PLAN.md Decisions 1)
    ext.m3Media3Version = '1.11.1'

    repositories {
        google()
        mavenCentral()
        // IntelliJ 'Read timed out' (error 403)
        // https://stackoverflow.com/questions/74258160/is-jcenter-down-permanently-31-oct
        //jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:' + m3AgpVersion
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:' + m3KotlinVersion

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        //flatDir { dirs 'libs' } // include duktape-my to all subprojects
        // IntelliJ 'Read timed out' (error 403)
        // https://stackoverflow.com/questions/74258160/is-jcenter-down-permanently-31-oct
        //jcenter()
    }
    configurations.all {
        // WorkManager conflict resolution (lint exception: old java runtime)
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata-core:' + liveDataVersion
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata:' + liveDataVersion
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-runtime:' + liveDataVersion
        // Force Android 4 compatible okHttp version
        // JoTube M3: kept (SharedModules Kotlin code doesn't compile against OkHttp 4); the app uses its own
        // OkHttp3DataSource instead of media3-datasource-okhttp (built against OkHttp 4)
        resolutionStrategy.force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        // JoTube M3: Kotlin stdlib pinned to the Kotlin compiler version (was a downgrade for WorkManager);
        // coroutines/core-ktx stay at their older, binary-compatible versions
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + m3KotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:' + m3KotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:' + m3KotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + kotlinxVersion
        resolutionStrategy.force 'androidx.core:core-ktx:' + kotlinCoreXVersion
        resolutionStrategy.force 'androidx.core:core:' + coreXVersion
        resolutionStrategy.force 'androidx.annotation:annotation:' + annotationXVersion
        // Downgrade Cronet version for cronet-okhttp
        resolutionStrategy.force 'org.chromium.net:cronet-api:' + cronetApiVersion
        resolutionStrategy.force 'androidx.multidex:multidex:' + multiDexVersion

        // Replace with modded library (leanback-1.0.0)
        exclude group: 'androidx.leanback', module: 'leanback'
        // Replace with modded library (fragment-1.1.0)
        exclude group: 'androidx.fragment', module: 'fragment'

        // Don't work! Replace with modded library (leanback-1.0.0)
        // resolutionStrategy.dependencySubstitution {
        //     // substitute remote dependency with local module
        //     substitute module('androidx.leanback:leanback') using project(':leanback-1.0.0')
        // }
    }
}

// JoTube M3 toolchain glue for AGP 8 without touching the submodules (MediaServiceCore, SharedModules):
// - namespace comes from the module manifest's package attribute (AGP 8 needs it in Gradle),
// - manifests are fed to AGP as copies without package= (AGP 8 rejects it in source manifests),
// - compileSdk 36 for every module (targetSdk of the app flavor is pinned separately),
// - Kotlin bytecode target 1.8 like the Java code (AGP 8/Kotlin 2 fail on mismatched JVM targets).
subprojects { p ->
    // JoTube M3 (stage 2c): show all compiler errors, not only the first 100 per module
    p.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xmaxerrs', '2000']
    }
    def m3Glue = {
        def android = p.extensions.getByName('android')
        def mainManifest = p.file('src/main/AndroidManifest.xml')
        if (android.namespace == null && mainManifest.exists()) {
            def m = (mainManifest.text =~ /package\s*=\s*"([^"]+)"/)
            if (m.find()) {
                android.namespace = m.group(1)
            }
        }
        android.buildFeatures.buildConfig = true // AGP 8 default is off; code uses BuildConfig
        android.sourceSets.configureEach { ss ->
            def mf = p.file("src/${ss.name}/AndroidManifest.xml")
            if (mf.exists() && mf.text =~ /\spackage\s*=\s*"[^"]+"/) {
                // outside build/ so `clean` (run after configuration) can't delete the copies
                def out = new File(rootProject.projectDir,
                        ".gradle/m3-manifests/${p.path.replace(':', '_')}/${ss.name}/AndroidManifest.xml")
                out.parentFile.mkdirs()
                out.text = mf.text.replaceFirst(/\s+package\s*=\s*"[^"]+"/, '')
                ss.manifest.srcFile out
            }
        }
        // finalizeDsl runs after the module's android {} block and still allows DSL changes
        p.extensions.getByName('androidComponents').finalizeDsl { ext ->
            ext.compileSdk = rootProject.ext.m3CompileSdk
            ext.buildToolsVersion = '36.0.0'
        }
    }
    p.plugins.withId('com.android.library', m3Glue)
    p.plugins.withId('com.android.application', m3Glue)
    p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
        compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}
