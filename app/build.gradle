plugins {
    id 'com.android.application'
}

android {
    namespace 'org.jotube.keys'
    compileSdk 34

    defaultConfig {
        applicationId 'org.jotube.keys'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
